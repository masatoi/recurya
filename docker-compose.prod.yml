name: recurya-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recurya}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=512MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recurya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 400m

  recurya:
    image: ghcr.io/masatoi/recurya:${RECURYA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "13000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-recurya}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:?OAUTH_REDIRECT_BASE is required}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      ADMIN_OAUTH_EMAIL: ${ADMIN_OAUTH_EMAIL:-}
      TZ: Asia/Tokyo
    expose:
      - "13000"
    healthcheck:
      # bash /dev/tcp TCP check on the app port (the image has bash; no extra
      # deps). start_period covers the from-source load time before first boot.
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/13000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 900m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      recurya:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
